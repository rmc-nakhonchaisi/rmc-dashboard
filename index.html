<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ร่วมมิตรคอนกรีต(นครชัยศรี) - คุณภาพผลิตภัณฑ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#f4f6f9; --card:#ffffff; --border:#e5e9ef; --table-border:#dfe4ea;
    --ink:#1f2937; --ink-soft:#4b5563; --muted:#6b7280;
    --blue:#2563eb; --blue-dark:#1d4ed8; --navy:#1f3a63;
    --red:#dc2626; --green-btn:#16a34a;
    --namya-blue:#29ABE2; --namya-green:#92D050; --namya-orange:#F4B183;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body { font-family:'Noto Sans Thai', system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  a { color:var(--blue); }
  a:hover { color:var(--blue-dark); }
  input, select, button { font-family:'Noto Sans Thai', system-ui, sans-serif; }

  .header { background:#fff; border-bottom:1px solid var(--border); padding:16px 28px; }
  .header-inner { display:flex; align-items:center; gap:14px; }
  .logo { width:64px; height:64px; border-radius:12px; border:3px solid var(--red); display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff; flex-shrink:0; }
  .logo-word { font-size:19px; font-weight:800; letter-spacing:0.5px; line-height:1; }
  .logo-word .r, .logo-word .c { color:var(--red); }
  .logo-word .m { color:var(--blue-dark); }
  .logo-dots { display:flex; gap:3px; margin-top:4px; }
  .logo-dots span { width:5px; height:5px; border-radius:50%; }
  .logo-dots span:nth-child(odd) { background:var(--red); }
  .logo-dots span:nth-child(even) { background:var(--blue-dark); }
  .company-name { font-size:20px; font-weight:700; color:var(--ink); }
  .company-sub { font-size:15px; font-weight:600; color:var(--blue); margin-top:2px; }

  .tabnav { background:#fff; border-bottom:1px solid var(--border); padding:0 20px; display:flex; flex-wrap:wrap; gap:2px; }
  .tabnav button { border:none; background:transparent; cursor:pointer; padding:14px; font-size:13px; font-weight:500; color:var(--ink-soft); border-bottom:3px solid transparent; white-space:nowrap; }
  .tabnav button.active { font-weight:700; color:var(--blue); border-bottom-color:var(--blue); }

  .page { padding:24px 28px 60px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:20px 22px; }
  .card-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .card-head h2 { margin:0; font-size:18px; color:var(--ink); }
  .search-box { border:1px solid #d1d5db; border-radius:6px; padding:7px 12px; font-size:13px; width:220px; }
  .head-actions { display:flex; gap:10px; }

  .btn-primary { border:none; background:var(--blue); color:#fff; border-radius:6px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .btn-primary:disabled { opacity:.6; cursor:default; }
  .btn-add-col { border:none; background:var(--blue); color:#fff; border-radius:6px; padding:5px 10px; cursor:pointer; font-size:16px; line-height:1; }
  .btn-green { border:none; background:var(--green-btn); color:#fff; border-radius:6px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .btn-plain { border:1px solid #d1d5db; background:#fff; color:#374151; border-radius:6px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .link-remove { cursor:pointer; color:var(--red); font-size:13px; font-weight:700; }
  .link-move { cursor:pointer; color:var(--blue); font-size:14px; font-weight:700; padding:0 2px; user-select:none; }
  .link-move:hover { color:var(--blue-dark); }

  .mix-scroll { margin-bottom:28px; }
  table.mix-table { border-collapse:collapse; width:100%; table-layout:fixed; }
  table.mix-table th, table.mix-table td { border:1px solid var(--table-border); overflow-wrap:break-word; }
  table.mix-table thead th.section-name { background:var(--navy); color:#fff; padding:10px 8px; text-align:left; font-weight:400; width:110px; }
  table.mix-table thead th.product-col { background:#eef2f7; padding:6px 4px; text-align:center; }
  table.mix-table thead th.add-col { background:#eef2f7; width:30px; text-align:center; }
  .product-col-inner { display:flex; align-items:center; gap:4px; justify-content:center; }
  .product-name-input { border:none; background:transparent; text-align:center; font-weight:700; font-size:11px; width:100%; min-width:0; color:var(--ink); }
  table.mix-table tbody td.row-label { padding:8px 14px; font-weight:700; color:#374151; background:#fafbfc; }
  table.mix-table tbody td.row-label .unit { font-weight:400; color:#9ca3af; font-size:11px; }
  table.mix-table tbody td.cell { padding:6px; text-align:center; }
  table.mix-table tbody td.add-col-cell { background:#fafbfc; }
  .cell-input { border:none; background:transparent; text-align:center; font-size:13px; width:100%; }
  .cell-select { border:none; background:transparent; text-align:center; font-size:12px; width:100%; }
  .cell-computed { display:block; text-align:center; font-size:13px; color:#374151; cursor:default; }
  .multiplier-input { width:52px; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.45); border-radius:4px; color:#fff; text-align:center; font-size:14px; padding:2px 4px; }
  .variant-select { width:100%; border:1px solid #d1d5db; border-radius:4px; padding:3px 2px; font-size:11px; background:#fff; color:var(--ink); }

  table.plain-table { width:100%; border-collapse:collapse; }
  table.plain-table thead tr { background:var(--navy); color:#fff; }
  table.plain-table thead th { padding:10px; text-align:left; font-weight:400; }
  table.plain-table tbody tr { border-bottom:1px solid #eef1f5; }
  table.plain-table tbody td { padding:6px 10px; }
  table.plain-table tbody td input { border:none; background:transparent; width:100%; }
  .pile-scroll { overflow-x:auto; }
  table.pile-table { min-width:900px; }
  table.pile-table td input.f-name { font-weight:700; }

  .legend-row { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; margin-bottom:16px; font-size:13px; }
  .legend-group { display:flex; align-items:center; gap:8px; }
  .legend-label { font-weight:600; color:#374151; }
  .legend-chip { padding:3px 8px; border-radius:4px; }
  .hint-note { font-size:13px; color:var(--muted); font-style:italic; }

  .loading-overlay { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:200; }
  .spinner { width:40px; height:40px; border-radius:50%; border:3px solid var(--table-border); border-top-color:var(--blue); animation:spin .75s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .err-banner { background:#fff3f3; border:1px solid #f0b0b0; color:#9b1c1c; border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:13px; }
</style>
</head>
<body>

<div class="tabnav" id="tabnav"></div>
<div class="page"><div id="tabContent"></div></div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div>กำลังโหลดข้อมูล...</div>
</div>

<script>
// ============================================================
// เชื่อม Supabase โดยตรงจากเบราว์เซอร์ (ใช้ publishable key เท่านั้น
// ปลอดภัยที่จะฝังในโค้ด client — ตารางเปิด RLS "allow all" ไว้แล้ว)
// ============================================================
const SUPABASE_URL = 'https://xhalgbxkhwrfrdrnrptb.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_-TA-9Yc_j_uZ6_0PIxCY_w_iENck1hq';

async function sbFetch(path, method, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: method || 'GET',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`Supabase error ${res.status}: ${text}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const NAMYA_LABELS = { blue: 'PCE(silkroad)', green: 'PCE(DB)', orange: 'แนปทาลีน(DB)' };
const NAMYA_COLORS = { blue: '#29ABE2', green: '#92D050', orange: '#F4B183' };

const ROW_DEFS = [
  { key: 'cement', label: 'Cement', unit: '[กก.]' },
  { key: 'hin1', label: 'หิน 1"', unit: '[กก.]' },
  { key: 'hin34', label: 'หิน 3/4"', unit: '[กก.]' },
  { key: 'hin38', label: 'หิน 3/8"', unit: '[กก.]' },
  { key: 'sand', label: 'ทราย', unit: '[กก.]' },
  { key: 'water', label: 'น้ำ', unit: '[กก.]' },
  { key: 'namyaKg', label: 'น้ำยา', unit: '[กก.]', colored: true },
  { key: 'namyaCc', label: 'น้ำยา', unit: '[ซีซี]', colored: true },
  { key: 'namyaType', label: 'ประเภทน้ำยา', unit: '', isSelect: true },
];

const PRODUCT_FIELD_MAP = {
  name: 'name', namyaType: 'namya_type', cement: 'cement', hin1: 'hin1',
  hin34: 'hin34', hin38: 'hin38', sand: 'sand', water: 'water', namyaKg: 'namya_kg', namyaCc: 'namya_cc',
  sourceProductId: 'source_product_id',
};
const PICKER_SECTION_IDX = 2; // section ที่ 3 ("สูตรใช้ปัจจุบัน") — 1 คอลัมน์ต่อ 1 กลุ่มสินค้า เลือกสูตรตัวแทนได้
// ฟิลด์ตัวเลขที่คำนวณอัตโนมัติ = ตัวคูณของ section × ค่าช่องเดียวกันใน "สูตร 1 คิว" (section แรก)
const COMPUTED_FIELDS = ['cement', 'hin1', 'hin34', 'hin38', 'sand', 'water', 'namyaKg', 'namyaCc'];
const ROUND_DECIMALS = { cement: 0, hin1: 0, hin34: 0, hin38: 0, sand: 0, water: 0, namyaKg: 1, namyaCc: 0 };

function computeDerivedValue(key, baseValue, multiplier) {
  if (baseValue == null || baseValue === '' || baseValue === '-') return '-';
  const num = parseFloat(String(baseValue).replace(/,/g, ''));
  if (isNaN(num)) return baseValue;
  const decimals = ROUND_DECIMALS[key] ?? 0;
  const factor = Math.pow(10, decimals);
  const result = Math.round(num * multiplier * factor) / factor;
  return result.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

const TABS = [
  { id: 'quality', label: 'คุณภาพผลิตภัณฑ์' },
  { id: 'pilespec', label: 'Spec ผลิตภัณฑ์' },
  { id: 'stock', label: 'Stock วัตถุดิบผลิตภัณฑ์' },
  { id: 'warehouse', label: 'คลังสินค้าผลิตภัณฑ์' },
  { id: 'qc', label: 'ตรวจสอบ QC' },
];

const PILE_FIELD_MAP = {
  name: 'name', section: 'section_size', length: 'standard_length',
  weightPerM: 'weight_per_m', capacity: 'safe_capacity', mainRebar: 'main_rebar', spiral: 'spiral_rebar',
};

let state = {
  activeTab: 'quality',
  search: '',
  mixSections: [],
  pileSearch: '',
  pileRows: [],
};

function stripGroupPrefix(name) {
  return String(name || '').replace(/^\(\d+\)\s*/, '').trim();
}

// จัดกลุ่มคอลัมน์ของ "สูตร 1 คิว" ตามชื่อ (ตัด "(n)" นำหน้าออก) — ใช้กรองเฉพาะตารางที่ 3
function computeGroups() {
  const base = state.mixSections[0];
  if (!base) return [];
  const order = [];
  const map = new Map();
  base.products.forEach((p, idx) => {
    const key = stripGroupPrefix(p.name) || p.name || '(ไม่มีชื่อ)';
    if (!map.has(key)) { map.set(key, []); order.push(key); }
    map.get(key).push(idx);
  });
  return order.map(key => ({ key, indexes: map.get(key) }));
}

function esc(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function showError(msg) {
  document.getElementById('tabContent').insertAdjacentHTML('afterbegin', `<div class="err-banner">เกิดข้อผิดพลาด: ${esc(msg)}</div>`);
}

// ---------- Data loading ----------
async function getDashboardData() {
  const [sections, products, pileRows] = await Promise.all([
    sbFetch('mix_sections?select=*&order=sort_order.asc'),
    sbFetch('mix_products?select=*&order=sort_order.asc'),
    sbFetch('pile_specs?select=*&order=sort_order.asc'),
  ]);

  const mixSections = sections.map(s => ({
    id: s.id, name: s.name, multiplier: s.multiplier == null ? null : Number(s.multiplier),
    products: products.filter(p => p.section_id === s.id).map(p => ({
      id: p.id, name: p.name, namyaType: p.namya_type,
      cement: p.cement, hin1: p.hin1, hin34: p.hin34, hin38: p.hin38, sand: p.sand, water: p.water,
      namyaKg: p.namya_kg, namyaCc: p.namya_cc, sourceProductId: p.source_product_id,
    })),
  }));

  return {
    mixSections,
    pileRows: pileRows.map(r => ({
      id: r.id, name: r.name, section: r.section_size, length: r.standard_length,
      weightPerM: r.weight_per_m, capacity: r.safe_capacity, mainRebar: r.main_rebar, spiral: r.spiral_rebar,
    })),
  };
}

// ---------- Concrete formula tab ----------
function buildMixSectionHtml(section, term, baseSection, sectionIdx) {
  const isPickerSection = sectionIdx === PICKER_SECTION_IDX;
  const groups = isPickerSection ? computeGroups() : [];

  const indexed = section.products
    .map((p, idx) => ({ p, idx }))
    .filter(({ p }) => !term || p.name.toLowerCase().includes(term));
  const isDerivedSection = section.multiplier != null;

  let headerCell;
  if (isDerivedSection) {
    headerCell = `<th class="section-name"><input type="number" step="0.01" class="multiplier-input" value="${esc(section.multiplier)}" data-action="section-multiplier" data-section="${section.id}" /> ${esc(section.name)}</th>`;
  } else {
    headerCell = `<th class="section-name">${esc(section.name)}</th>`;
  }

  let html = `<div class="mix-scroll"><table class="mix-table"><thead><tr>${headerCell}`;
  indexed.forEach(({ p, idx }) => {
    if (isPickerSection) {
      const group = groups.find(g => g.key === p.name);
      const variants = group ? group.indexes.map(i => baseSection.products[i]) : [];
      html += `<th class="product-col"><div class="product-col-inner" style="flex-direction:column; gap:4px;">
        <span class="product-name-input" style="cursor:default; font-weight:700;">${esc(p.name)}</span>
        <select class="variant-select" data-action="picker-variant" data-product="${p.id}">
          ${variants.map(v => `<option value="${v.id}" ${v.id === p.sourceProductId ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}
        </select>
      </div></th>`;
      return;
    }
    const isNameLinked = isDerivedSection && baseSection && baseSection.products[idx];
    const nameField = isNameLinked
      ? `<span class="product-name-input" style="cursor:default;" title="ชื่อตามสูตร 1 คิว">${esc(p.name)}</span>`
      : `<input class="product-name-input" value="${esc(p.name)}" data-action="product-name" data-product="${p.id}" />`;
    const removeBtn = isDerivedSection ? '' : `<span class="link-remove" data-action="product-remove" data-product="${p.id}">&times;</span>`;
    const moveButtons = isDerivedSection ? '' : `
      <span class="link-move" data-action="product-move" data-product="${p.id}" data-dir="-1" title="ย้ายซ้าย">&lsaquo;</span>
      <span class="link-move" data-action="product-move" data-product="${p.id}" data-dir="1" title="ย้ายขวา">&rsaquo;</span>`;
    html += `<th class="product-col"><div class="product-col-inner">
      ${moveButtons}
      ${nameField}
      ${removeBtn}
    </div></th>`;
  });
  const addColCell = (isDerivedSection || isPickerSection) ? '' : `<th class="add-col"><button class="btn-add-col" data-action="product-add" data-section="${section.id}">+</button></th>`;
  html += `${addColCell}</tr></thead><tbody>`;

  ROW_DEFS.forEach(rd => {
    html += `<tr><td class="row-label">${esc(rd.label)} <span class="unit">${esc(rd.unit)}</span></td>`;
    indexed.forEach(({ p, idx }) => {
      const isSelect = !!rd.isSelect;
      if (isPickerSection) {
        const bg = rd.colored || isSelect ? NAMYA_COLORS[p.namyaType] : '#fff';
        const text = isSelect ? NAMYA_LABELS[p.namyaType] : p[rd.key];
        html += `<td class="cell" style="background:${bg};"><span class="cell-computed" title="คำนวณจากสูตรที่เลือก × ตัวคูณ">${esc(text)}</span></td>`;
        return;
      }
      const isTypeLinked = isSelect && isDerivedSection && baseSection && baseSection.products[idx];
      const isComputed = isDerivedSection && !isSelect && COMPUTED_FIELDS.includes(rd.key) && baseSection && baseSection.products[idx];
      const bg = rd.colored ? NAMYA_COLORS[p.namyaType] : (isSelect ? NAMYA_COLORS[p.namyaType] : '#fff');
      html += `<td class="cell" style="background:${bg};">`;
      if (isTypeLinked) {
        html += `<span class="cell-computed" title="ตามสูตร 1 คิว">${esc(NAMYA_LABELS[p.namyaType])}</span>`;
      } else if (isSelect) {
        html += `<select class="cell-select" data-action="cell-select" data-product="${p.id}">`;
        ['blue', 'green', 'orange'].forEach(k => {
          html += `<option value="${k}" ${p.namyaType === k ? 'selected' : ''}>${esc(NAMYA_LABELS[k])}</option>`;
        });
        html += `</select>`;
      } else if (isComputed) {
        html += `<span class="cell-computed" title="คำนวณจากสูตร 1 คิว × ตัวคูณ">${esc(p[rd.key])}</span>`;
      } else {
        html += `<input class="cell-input" value="${esc(p[rd.key])}" data-action="cell-value" data-product="${p.id}" data-key="${rd.key}" />`;
      }
      html += `</td>`;
    });
    if (!isDerivedSection && !isPickerSection) html += `<td class="add-col-cell"></td>`;
    html += `</tr>`;
  });

  html += `</tbody></table></div>`;
  return html;
}

function renderConcreteTab() {
  const term = (state.search || '').trim().toLowerCase();
  let html = `<div class="card">
    <div class="card-head">
      <h2>คุณภาพผลิตภัณฑ์</h2>
      <input class="search-box" placeholder="ค้นหาผลิตภัณฑ์..." id="concreteSearch" value="${esc(state.search)}" />
    </div>`;
  const baseSection = state.mixSections[0];
  state.mixSections.forEach((sec, idx) => { html += buildMixSectionHtml(sec, term, baseSection, idx); });
  html += `<div class="legend-row">
    <div class="legend-group">
      <span class="legend-label">ถพ.น้ำยา 1.08</span>
      <span class="legend-chip" style="background:${NAMYA_COLORS.blue};color:#fff;">PCE(silkroad)</span>
      <span class="legend-chip" style="background:${NAMYA_COLORS.green};color:#1f2937;">PCE(DB)</span>
    </div>
    <div class="legend-group">
      <span class="legend-label">ถพ.น้ำยา 1.25</span>
      <span class="legend-chip" style="background:${NAMYA_COLORS.orange};color:#1f2937;">แนปทาลีน(DB)</span>
    </div>
  </div>
  <div class="hint-note">* คลิกที่ค่าตัวเลขหรือชื่อผลิตภัณฑ์เพื่อแก้ไข — สามารถเลือกได้เปลี่ยนได้</div>
  </div>`;
  document.getElementById('tabContent').innerHTML = html;
}

// ---------- Pile spec tab ----------
function renderPileSpecTab() {
  const term = (state.pileSearch || '').trim().toLowerCase();
  const rows = state.pileRows.filter(r => !term || r.name.toLowerCase().includes(term) || r.section.toLowerCase().includes(term));
  let html = `<div class="card">
    <div class="card-head">
      <h2>Spec ผลิตภัณฑ์</h2>
      <div class="head-actions">
        <input class="search-box" placeholder="ค้นหารุ่น..." id="pileSearch" value="${esc(state.pileSearch)}" style="width:200px;" />
        <button class="btn-primary" data-action="pile-add">+ เพิ่มรุ่น</button>
      </div>
    </div>
    <div class="pile-scroll"><table class="plain-table pile-table">
      <thead><tr>
        <th>รุ่นเสาเข็ม</th><th>ขนาดหน้าตัด</th><th>ความยาวมาตรฐาน</th><th>น้ำหนักโดยประมาณ</th>
        <th>กำลังรับน้ำหนักปลอดภัย</th><th>เหล็กเสริมหลัก</th><th>เหล็กปลอกเกลียว</th><th></th>
      </tr></thead>
      <tbody>`;
  rows.forEach(r => {
    html += `<tr>
      <td><input class="f-name" value="${esc(r.name)}" data-action="pile-field" data-id="${r.id}" data-key="name" /></td>
      <td><input value="${esc(r.section)}" data-action="pile-field" data-id="${r.id}" data-key="section" /></td>
      <td><input value="${esc(r.length)}" data-action="pile-field" data-id="${r.id}" data-key="length" /></td>
      <td><input value="${esc(r.weightPerM)}" data-action="pile-field" data-id="${r.id}" data-key="weightPerM" /></td>
      <td><input value="${esc(r.capacity)}" data-action="pile-field" data-id="${r.id}" data-key="capacity" /></td>
      <td><input value="${esc(r.mainRebar)}" data-action="pile-field" data-id="${r.id}" data-key="mainRebar" /></td>
      <td><input value="${esc(r.spiral)}" data-action="pile-field" data-id="${r.id}" data-key="spiral" /></td>
      <td style="text-align:center;"><span class="link-remove" data-action="pile-remove" data-id="${r.id}">&times;</span></td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;
  document.getElementById('tabContent').innerHTML = html;
}

    <div style="padding:40px 0; text-align:center; color:var(--muted);">ยังไม่มีข้อมูลในแท็บนี้</div>

function renderTabNav() {
  document.getElementById('tabnav').innerHTML = TABS.map(t =>
    `<button data-action="set-tab" data-tab="${t.id}" class="${state.activeTab === t.id ? 'active' : ''}">${esc(t.label)}</button>`
  ).join('');
}

function render() {
  renderTabNav();
  if (state.activeTab === 'pilespec') renderPileSpecTab();
  else if (state.activeTab === 'stock') renderStockTab();
  else if (state.activeTab === 'warehouse') renderWarehouseTab();
  else if (state.activeTab === 'qc') renderQcTab();
  else renderConcreteTab();
}

function findProduct(productId) {
  for (const sec of state.mixSections) {
    const p = sec.products.find(x => x.id === productId);
    if (p) return p;
  }
  return null;
}
function findPile(id) { return state.pileRows.find(r => r.id === id) || null; }

// คำนวณค่าตัวเลขทั้งหมดของ section ที่มีตัวคูณ ใหม่จาก "สูตร 1 คิว" (section แรก)
// อัปเดต state ในตัว และคืนรายการ patch สำหรับบันทึกลง Supabase
function recomputeDerivedSection(sectionIdx) {
  const section = state.mixSections[sectionIdx];
  const base = state.mixSections[0];
  if (!section || section.multiplier == null || !base) return [];
  const patches = [];
  section.products.forEach((p, idx) => {
    const baseP = base.products[idx];
    if (!baseP) return;
    const patch = {};
    if (p.name !== baseP.name) { p.name = baseP.name; patch.name = baseP.name; }
    if (p.namyaType !== baseP.namyaType) { p.namyaType = baseP.namyaType; patch.namya_type = baseP.namyaType; }
    COMPUTED_FIELDS.forEach(key => {
      const newVal = computeDerivedValue(key, baseP[key], section.multiplier);
      p[key] = newVal;
      patch[PRODUCT_FIELD_MAP[key]] = newVal;
    });
    patches.push({ id: p.id, patch });
  });
  return patches;
}

// คำนวณค่าของ section เลือกสูตร ("สูตรใช้ปัจจุบัน") 1 คอลัมน์ต่อ 1 กลุ่ม
// จากผลิตภัณฑ์ต้นทางที่เลือกไว้ (sourceProductId) ใน "สูตร 1 คิว"
function recomputePickerSection(sectionIdx) {
  const section = state.mixSections[sectionIdx];
  const base = state.mixSections[0];
  if (!section || !base) return [];
  const groups = computeGroups();
  const patches = [];
  section.products.forEach(p => {
    const group = groups.find(g => g.key === p.name);
    let src = base.products.find(bp => bp.id === p.sourceProductId);
    if (!src || (group && !group.indexes.some(i => base.products[i].id === src.id))) {
      src = group ? base.products[group.indexes[0]] : base.products[0];
    }
    if (!src) return;
    const patch = {};
    if (p.sourceProductId !== src.id) { p.sourceProductId = src.id; patch.source_product_id = src.id; }
    if (p.namyaType !== src.namyaType) { p.namyaType = src.namyaType; patch.namya_type = src.namyaType; }
    COMPUTED_FIELDS.forEach(key => {
      const newVal = computeDerivedValue(key, src[key], section.multiplier);
      p[key] = newVal;
      patch[PRODUCT_FIELD_MAP[key]] = newVal;
    });
    patches.push({ id: p.id, patch });
  });
  return patches;
}

function recomputeSection(sectionIdx) {
  return sectionIdx === PICKER_SECTION_IDX ? recomputePickerSection(sectionIdx) : recomputeDerivedSection(sectionIdx);
}

async function persistPatches(patches) {
  await Promise.all(patches.map(({ id, patch }) => sbFetch(`mix_products?id=eq.${id}`, 'PATCH', patch)));
}

// ---------- Event delegation ----------
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;

  try {
    if (action === 'set-tab') {
      state.activeTab = t.dataset.tab;
      render();
    } else if (action === 'pile-add') {
      t.disabled = true;
      const rows = await sbFetch('pile_specs', 'POST', {
        name: 'ใหม่', section_size: '', standard_length: '', weight_per_m: '', safe_capacity: '', main_rebar: '', spiral_rebar: '', sort_order: 999,
      });
      state.pileRows.push({ id: rows[0].id, name: 'ใหม่', section: '', length: '', weightPerM: '', capacity: '', mainRebar: '', spiral: '' });
      renderPileSpecTab();
    } else if (action === 'pile-remove') {
      const id = t.dataset.id;
      state.pileRows = state.pileRows.filter(r => r.id !== id);
      renderPileSpecTab();
      await sbFetch(`pile_specs?id=eq.${id}`, 'DELETE');
    } else if (action === 'product-remove') {
      const pid = t.dataset.product;
      const baseSec = state.mixSections[0];
      const baseIdx = baseSec ? baseSec.products.findIndex(p => p.id === pid) : -1;
      const isBaseRemoval = baseIdx !== -1;

      state.mixSections.forEach(sec => { sec.products = sec.products.filter(p => p.id !== pid); });
      await sbFetch(`mix_products?id=eq.${pid}`, 'DELETE');

      // ลบคอลัมน์ในสูตรฐาน ต้องลบคอลัมน์คู่กัน (ตำแหน่งเดียวกัน) ใน section ที่มีตัวคูณด้วย ให้จำนวนคอลัมน์ตรงกัน
      // (ยกเว้น section เลือกสูตร ซึ่งมีจำนวนคอลัมน์คงที่ตามจำนวนกลุ่ม ไม่ต้องลบตาม)
      if (isBaseRemoval) {
        for (let i = 1; i < state.mixSections.length; i++) {
          if (i === PICKER_SECTION_IDX) continue;
          const derivedSec = state.mixSections[i];
          if (derivedSec.multiplier == null) continue;
          if (baseIdx < derivedSec.products.length) {
            const removed = derivedSec.products.splice(baseIdx, 1)[0];
            await sbFetch(`mix_products?id=eq.${removed.id}`, 'DELETE');
          }
        }
        let patches = [];
        for (let i = 1; i < state.mixSections.length; i++) patches = patches.concat(recomputeSection(i));
        if (patches.length) await persistPatches(patches);
      }
      renderConcreteTab();
    } else if (action === 'product-move') {
      const pid = t.dataset.product;
      const dir = parseInt(t.dataset.dir, 10);
      const sec = state.mixSections.find(s => s.products.some(p => p.id === pid));
      if (sec) {
        const idx = sec.products.findIndex(p => p.id === pid);
        const swapIdx = idx + dir;
        if (swapIdx >= 0 && swapIdx < sec.products.length) {
          [sec.products[idx], sec.products[swapIdx]] = [sec.products[swapIdx], sec.products[idx]];
          const patches = sec.products.map((p, i) => ({ id: p.id, patch: { sort_order: i } }));

          let derivedPatches = [];
          if (sec === state.mixSections[0]) {
            for (let i = 1; i < state.mixSections.length; i++) derivedPatches = derivedPatches.concat(recomputeSection(i));
          }
          renderConcreteTab();
          await persistPatches(patches);
          if (derivedPatches.length) await persistPatches(derivedPatches);
        }
      }
    } else if (action === 'product-add') {
      t.disabled = true;
      const sectionId = t.dataset.section;
      const rows = await sbFetch('mix_products', 'POST', {
        section_id: sectionId, name: 'ผลิตภัณฑ์ใหม่', namya_type: 'blue',
        cement: '0', hin1: '-', hin34: '-', hin38: '0', sand: '0', water: '0', namya_kg: '0', namya_cc: '0', sort_order: 999,
      });
      const sec = state.mixSections.find(s => s.id === sectionId);
      if (sec) sec.products.push({ id: rows[0].id, name: 'ผลิตภัณฑ์ใหม่', namyaType: 'blue', cement: '0', hin1: '-', hin34: '-', hin38: '0', sand: '0', water: '0', namyaKg: '0', namyaCc: '0' });

      // เพิ่มคอลัมน์ในสูตรฐาน ต้องเพิ่มคอลัมน์คู่กันใน section ที่มีตัวคูณด้วย ให้จำนวนคอลัมน์ตรงกัน
      // (ยกเว้น section เลือกสูตร ซึ่งมีจำนวนคอลัมน์คงที่ตามจำนวนกลุ่ม ไม่ต้องเพิ่มตาม)
      if (sec === state.mixSections[0]) {
        for (let i = 1; i < state.mixSections.length; i++) {
          if (i === PICKER_SECTION_IDX) continue;
          const derivedSec = state.mixSections[i];
          if (derivedSec.multiplier == null) continue;
          const newRows = await sbFetch('mix_products', 'POST', {
            section_id: derivedSec.id, name: 'ผลิตภัณฑ์ใหม่', namya_type: 'blue',
            cement: '0', hin1: '-', hin34: '-', hin38: '0', sand: '0', water: '0', namya_kg: '0', namya_cc: '0', sort_order: 999,
          });
          derivedSec.products.push({ id: newRows[0].id, name: '', namyaType: 'blue', cement: '0', hin1: '-', hin34: '-', hin38: '0', sand: '0', water: '0', namyaKg: '0', namyaCc: '0' });
        }
        let patches = [];
        for (let i = 1; i < state.mixSections.length; i++) patches = patches.concat(recomputeSection(i));
        if (patches.length) await persistPatches(patches);
      }
      renderConcreteTab();
    }
  } catch (err) {
    showError(err.message || String(err));
  }
});

document.addEventListener('change', async (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;

  try {
    if (action === 'product-name') {
      const p = findProduct(t.dataset.product);
      if (p) p.name = t.value;
      await sbFetch(`mix_products?id=eq.${t.dataset.product}`, 'PATCH', { name: t.value });

      // ถ้าแก้ชื่อใน "สูตร 1 คิว" (section ฐาน) ให้ชื่อ section ที่มีตัวคูณตามไปด้วย
      if (state.mixSections[0] && state.mixSections[0].products.some(pp => pp.id === t.dataset.product)) {
        let patches = [];
        for (let i = 1; i < state.mixSections.length; i++) {
          patches = patches.concat(recomputeSection(i));
        }
        if (patches.length) {
          renderConcreteTab();
          await persistPatches(patches);
        }
      }
    } else if (action === 'cell-value') {
      const p = findProduct(t.dataset.product);
      if (p) p[t.dataset.key] = t.value;
      const col = PRODUCT_FIELD_MAP[t.dataset.key];
      await sbFetch(`mix_products?id=eq.${t.dataset.product}`, 'PATCH', { [col]: t.value });

      // ถ้าแก้ค่าใน "สูตร 1 คิว" (section ฐาน) ให้คำนวณ section ที่มีตัวคูณใหม่ตาม
      if (COMPUTED_FIELDS.includes(t.dataset.key) && state.mixSections[0] &&
          state.mixSections[0].products.some(pp => pp.id === t.dataset.product)) {
        let patches = [];
        for (let i = 1; i < state.mixSections.length; i++) {
          patches = patches.concat(recomputeSection(i));
        }
        if (patches.length) {
          renderConcreteTab();
          await persistPatches(patches);
        }
      }
    } else if (action === 'cell-select') {
      const p = findProduct(t.dataset.product);
      if (p) p.namyaType = t.value;
      await sbFetch(`mix_products?id=eq.${t.dataset.product}`, 'PATCH', { namya_type: t.value });

      let patches = [];
      if (state.mixSections[0] && state.mixSections[0].products.some(pp => pp.id === t.dataset.product)) {
        for (let i = 1; i < state.mixSections.length; i++) {
          patches = patches.concat(recomputeSection(i));
        }
      }
      renderConcreteTab();
      if (patches.length) await persistPatches(patches);
    } else if (action === 'section-multiplier') {
      const sec = state.mixSections.find(s => s.id === t.dataset.section);
      const val = parseFloat(t.value);
      if (sec && !isNaN(val)) {
        sec.multiplier = val;
        const sectionIdx = state.mixSections.indexOf(sec);
        const patches = recomputeSection(sectionIdx);
        renderConcreteTab();
        await sbFetch(`mix_sections?id=eq.${sec.id}`, 'PATCH', { multiplier: val });
        await persistPatches(patches);
      }
    } else if (action === 'picker-variant') {
      const productId = t.dataset.product;
      const sec = state.mixSections[PICKER_SECTION_IDX];
      const p = sec && sec.products.find(x => x.id === productId);
      if (p) {
        p.sourceProductId = t.value;
        const patches = recomputePickerSection(PICKER_SECTION_IDX);
        renderConcreteTab();
        await persistPatches(patches);
      }
    } else if (action === 'pile-field') {
      const r = findPile(t.dataset.id);
      if (r) r[t.dataset.key] = t.value;
      const col = PILE_FIELD_MAP[t.dataset.key];
      await sbFetch(`pile_specs?id=eq.${t.dataset.id}`, 'PATCH', { [col]: t.value });
    }
  } catch (err) {
    showError(err.message || String(err));
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'concreteSearch') {
    state.search = e.target.value;
    renderConcreteTab();
  } else if (e.target.id === 'pileSearch') {
    state.pileSearch = e.target.value;
    renderPileSpecTab();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.closest('[data-action]')) {
    e.target.blur();
  }
});

// ---------- Boot ----------
(async function boot() {
  try {
    const data = await getDashboardData();
    state.mixSections = data.mixSections;
    state.pileRows = data.pileRows;
    render();
    document.getElementById('loadingOverlay').style.display = 'none';
  } catch (err) {
    document.getElementById('loadingOverlay').innerHTML = '<div class="err-banner">โหลดข้อมูลไม่สำเร็จ: ' + esc(err.message || String(err)) + '</div>';
  }
})();
</script>
